name: Test

on:
  pull_request:
  push:
    branches: [ main ]

# Read-only: this workflow runs code from pull requests, so it gets no write
# token and no secrets.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Test suite (hostile fixture feeds, no network)
        run: npm test
