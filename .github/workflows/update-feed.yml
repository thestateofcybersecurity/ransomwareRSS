name: Update ransomware feed

on:
  push:
    branches: [ main ]
  schedule:
    # Hourly. The previous 5-minute cron burned Actions minutes for a source
    # that itself refreshes far less often.
    - cron: '23 * * * *'
  workflow_dispatch:

# No default permissions. The one job that pushes to gh-pages asks for
# contents: write itself (pentest 2026-10-07, finding L7).
permissions: {}

# One run at a time: a slow run is never overlapped by the next hourly one.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Both scripts bound every download and parse in linear time, so a run
    # takes well under a minute. The timeout is the backstop: without one a
    # stuck step holds the job for GitHub's default of 6 hours (pentest
    # 2026-11-22, finding F-1).
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot swap in
      # different code. Dependabot (github-actions ecosystem) keeps the pins
      # current; the trailing comment is the tag each SHA was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scripts below parse hostile input. Do not leave the write
          # token in .git/config while they run; the deploy step is handed
          # the token explicitly.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate ransomware feed
        run: node index.js
        env:
          RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
      - name: Aggregate security news feeds
        run: node aggregate.js
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
